# Base compartida para cualquier perfil o escenario del proyecto.
[defaults]
scenario_key = "basic"
render = false
record_video = true
checkpoint_name = "doom_foundation_agent"
tensorboard_run_name = "Doom_Foundation_Agent"
frame_stack = 4
screen_width = 84
screen_height = 84
seed = 42
num_envs = 1
action_space_kind = "button_combinations"

# Reward shaping base compartido; cada escenario puede overridearlo si hace falta.
[defaults.reward_shaping]
scale = 1.0
offset = 0.0

# Politica global de early stopping; hoy queda desactivada por defecto.
[defaults.early_stopping]
enabled = false
patience_evaluations = 3
min_evaluations = 2
min_delta = 0.0

# Perfil publico principal del repo. Parte de la base compartida y apunta al escenario activo.
[profiles.default]
scenario_key = "basic"
